<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 교무실</title>
<!-- 말풍선: 갈무리 / 이름표·글자: Neo둥근모 (둘 다 SIL OFL 무료 폰트) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@1.600/neodgm/style.css">
<style>
:root{
  color-scheme:light;
  --bg:#F1F2F4; --ink:#2B3340; --sub:#5F6B7A; --panel:#FFFFFF; --edge:#C3CAD4; --on:#34495E; --onInk:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;--bg:#1C2128;--ink:#E8ECF1;--sub:#A5AFBC;--panel:#262D36;--edge:#3E4856}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1C2128;--ink:#E8ECF1;--sub:#A5AFBC;--panel:#262D36;--edge:#3E4856}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"NeoDunggeunmo","Malgun Gothic","Apple SD Gothic Neo",monospace}
.wrap{max-width:460px;margin:0 auto;padding:10px 10px 24px}
header{display:flex;align-items:baseline;justify-content:space-between;padding:2px 4px 8px}
h1{font-size:1.2rem;font-weight:400;margin:0}
.mode{font-size:.72rem;background:var(--on);color:var(--onInk);padding:2px 8px;margin-left:6px;vertical-align:middle;border-radius:8px}
.clock{color:var(--sub);font-size:.9rem}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border-radius:14px;border:3px solid var(--edge);background:#E4E7EC}
.panel{background:var(--panel);border:2px solid var(--edge);border-radius:14px;padding:10px 12px;margin-top:10px}
.panel h2{font-size:.95rem;font-weight:400;margin:0 0 4px;color:var(--sub)}
.grp{margin:8px 0 10px}
.grp b{display:block;font-weight:400;margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
.row button{font:inherit;font-size:.8rem;border:2px solid var(--edge);background:var(--bg);color:var(--ink);padding:4px 7px;border-radius:9px;cursor:pointer}
.row button[aria-pressed="true"]{background:var(--on);color:var(--onInk);border-color:var(--on)}
.row button:focus-visible{outline:2px solid var(--on);outline-offset:2px}
#list{list-style:none;margin:0;padding:0}#list li{padding:6px 0;border-bottom:1px dashed var(--edge);font-size:.9rem;line-height:1.5}#list li:last-child{border-bottom:0}#list small{color:var(--sub)}
.note{font-size:.8rem;color:var(--sub);line-height:1.6;margin:6px 0 0}
/* 위젯 모드: 그림만 화면에 꽉 차게 */
.widget body{background:transparent}
.widget .wrap{max-width:none;padding:0;height:100vh;display:flex;align-items:center;justify-content:center}
.widget header,.widget .panel{display:none}
.widget canvas{border:0;border-radius:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="ttl">AI 교무실<span class="mode" id="mode">연결 중</span></h1>
    <span class="clock" id="clock"></span>
  </header>
  <canvas id="cv" aria-label="3층 콘텐츠사업부, 2층 경영지원부, 1층 교육사업부가 일하는 사무실"></canvas>
  <div class="panel">
    <h2>층별 상황</h2>
    <ul id="list"></ul>
    <p class="note" id="msg">상태를 불러오는 중이에요…</p>
  </div>
</div>
</div>

<script>
const CFG = /*__CONFIG__*/null || {title:"AI 교무실", floors:[{theme:"t3",name:"3F 업무지원부"},{theme:"t2",name:"2F 학급경영부"},{theme:"t1",name:"1F 교과연구부"}]};
const VIEW = "", KEY = "";
const OFFICE = CFG.floors;                           // 위층부터 [{theme, name}]
document.title = CFG.title;
addEventListener("DOMContentLoaded", () => { const h = document.getElementById("ttl"); if (h && h.firstChild) h.firstChild.textContent = CFG.title; });
if (VIEW === "widget") document.documentElement.classList.add("widget");
/* ===== 화면 ===== */
const LW = 236, LH = 39 + 126 * (OFFICE.length - 1) + 129;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const lo = document.createElement("canvas"); lo.width = LW; lo.height = LH;
const g = lo.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const FONT = '"NeoDunggeunmo","Malgun Gothic","Apple SD Gothic Neo",monospace';     // 이름표
const TALK = '"Galmuri11","Galmuri9","Malgun Gothic","Apple SD Gothic Neo",sans-serif';  // 캐릭터 말풍선
let K = 4;
function resize(){ K = Math.max(2, Math.round(2*(window.devicePixelRatio||1))); cv.width = LW*K; cv.height = LH*K; }
resize(); addEventListener("resize", resize);
if (VIEW === "widget") cv.style.width = `min(100vw, calc(100vh * ${LW} / ${LH}))`;

const OX = 93;
let OY = 44;                                   // 층마다 바뀜
const P = (x,y,z) => [OX + (x - z)*10, OY + (x + z)*5 - y*10];
const R = (x,y,w,h,c) => { g.fillStyle = c; g.fillRect(Math.round(x),Math.round(y),w,h); };
function hex(h){ const n = parseInt(h.slice(1),16); return [n>>16,(n>>8)&255,n&255]; }
function shade(h,k){ const [r,gg,b] = hex(h), f = v => Math.max(0,Math.min(255,Math.round(v*k))); return `rgb(${f(r)},${f(gg)},${f(b)})`; }
function poly(pts, c){ g.beginPath(); pts.forEach(([x,y],i)=> i ? g.lineTo(x,y) : g.moveTo(x,y)); g.closePath(); g.fillStyle = c; g.fill(); }
function box(x0,x1,y0,y1,z0,z1,c){
  poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)], shade(c,1.08));
  poly([P(x0,y0,z1),P(x1,y0,z1),P(x1,y1,z1),P(x0,y1,z1)], shade(c,.93));
  poly([P(x1,y0,z0),P(x1,y0,z1),P(x1,y1,z1),P(x1,y1,z0)], shade(c,.78));
}
const onZ = (z,x0,x1,y0,y1,c) => poly([P(x0,y0,z),P(x1,y0,z),P(x1,y1,z),P(x0,y1,z)], c);
const onX = (x,z0,z1,y0,y1,c) => poly([P(x,y0,z0),P(x,y0,z1),P(x,y1,z1),P(x,y1,z0)], c);
const onY = (y,x0,x1,z0,z1,c) => poly([P(x0,y,z0),P(x1,y,z0),P(x1,y,z1),P(x0,y,z1)], c);

/* ===== 미니 인형 (16×20, 앞모습) ===== */
const BODY = [
"....oooooooo....",
"..oohhhhhhhhoo..",
".ohhhhhhhhhhhho.",
".ohhHHhhhhhhhho.",
"ohhhhhhhhhhhhhho",
"ohhsssshhsssshho",
"ohssssssssssssho",
"ohsseesssseessho",
"ohsseesssseessho",
".osrrssssssrrso.",
".osssssmmssssso.",
"..osssssssssso..",
"...oooossoooo...",
"..ocWWcTTcWWco..",
".oCccccTTccccCo.",
".oCccccTTccccCo.",
".osLLLLLLLLLLso.",
"..oppppppppppo..",
"..oppppooppppo..",
"..obbbo..obbbo.."];
const LEG_A = "..obbbo...oo....", LEG_B = "....oo...obbbo..";
const UP = [".occcccTTcccccо.".replace("о","o"),".occcccTTccccco.",".oLLLLLLLLLLLLo."];

function drawDoll(m, sx, sy, o){
  // o: {grey, closed, arms:"up", walk:0|1, sit, prop, t}
  const grey = o.grey, G = c => grey ? "#A9A3B5" : c;
  const pal = { o:"#3A2433", h:G(m.hair), H:G(shade(m.hair,1.35)), s:G("#FBD5B8"), e:"#3A2433", r:G("#FF9FB4"),
                m:G("#E0607E"), w:"#FFFFFF", c:G(m.shirt), C:G(shade(m.shirt,.86)), p:G(m.pants||"#3D4566"), b:"#2A2026",
                W:G(m.shirt === "#FFFFFF" ? "#E3E7F0" : "#FFFFFF"), T:G(m.tie || shade(m.shirt,.9)), L:"#2E2430" };
  const x = Math.round(sx) - 8, y = Math.round(sy) - 20 + (o.sit ? 3 : 0);
  let rows = BODY.slice();
  if (o.closed){ rows[7] = "ohssssssssssssho"; }
  if (o.arms === "up") rows.splice(14,3,...UP);
  if (o.walk === 1) rows[19] = LEG_A; else if (o.walk === 2) rows[19] = LEG_B;
  const n = o.sit ? 17 : 20;
  for (let r=0;r<n;r++) for (let c=0;c<16;c++){ const k = rows[r][c]; if (k !== "." && pal[k]) R(x+c,y+r,1,1,pal[k]); }
  if (!grey && !o.closed){ R(x+5,y+7,1,1,"#FFFFFF"); R(x+11,y+7,1,1,"#FFFFFF"); }
  // 머리 장식
  const acc = m.acc;
  if (acc === "ribbon"){ R(x+11,y-1,5,3,"#3A2433"); R(x+12,y,1,1,G("#FF7FAF")); R(x+14,y,1,1,G("#FF7FAF")); R(x+13,y,1,1,G("#E0457F")); }
  if (acc === "tuft"){ R(x+6,y-2,2,2,"#3A2433"); R(x+7,y-3,2,2,"#3A2433"); }
  if (acc === "buns"){ [x+1,x+11].forEach(bx => { R(bx,y-2,4,4,"#3A2433"); R(bx+1,y-1,2,2,pal.h); }); }
  if (acc === "cap"){ R(x+2,y-1,12,5,"#3A2433"); R(x+3,y,10,3,G(m.cap)); R(x+1,y+3,8,2,"#3A2433"); R(x+2,y+3,6,1,G(shade(m.cap,.8))); R(x+7,y,2,1,"#FFFFFF"); }
  if (acc === "glasses"){ R(x+3,y+6,4,1,"#3A2433"); R(x+9,y+6,4,1,"#3A2433"); R(x+3,y+6,1,3,"#3A2433"); R(x+6,y+6,1,3,"#3A2433"); R(x+9,y+6,1,3,"#3A2433"); R(x+12,y+6,1,3,"#3A2433"); R(x+7,y+7,2,1,"#3A2433"); }
  if (acc === "headset"){ R(x+3,y-1,10,1,"#3A2433"); R(x+1,y+4,2,5,"#3A2433"); R(x+13,y+4,2,5,"#3A2433"); R(x+13,y+9,1,2,"#3A2433"); R(x+12,y+10,2,1,"#3A2433"); }
  if (acc === "lanyard"){ R(x+6,y+13,1,2,"#4FA3F7"); R(x+9,y+13,1,2,"#4FA3F7"); R(x+6,y+15,4,3,"#3A2433"); R(x+7,y+16,2,1,"#FFFFFF"); }
  if (acc === "flower"){ R(x+1,y+1,3,3,G("#FFD34D")); R(x+2,y+2,1,1,G("#FF8A3D")); }
  if (o.arms === "up"){ const w = o.wave||0; [[-1],[15]].forEach(([dx]) => { R(x+dx,y+8-w,2,7,"#3A2433"); R(x+dx,y+9-w,2,5,pal.C); R(x+dx,y+6-w,2,3,pal.s); }); }
  // 들고 있는 것
  const t = o.t || 0;
  if (o.prop === "book"){ R(x+3,y+13,10,5,"#3A2433"); R(x+4,y+14,4,3,"#FFFFFF"); R(x+8,y+14,4,3,"#FFF2C9"); if (!reduce && Math.floor(t*2)%2) R(x+8,y+14,2,3,"#E8DDB8"); }
  if (o.prop === "lens"){ const b = reduce ? 0 : Math.round(Math.sin(t*3)*1.5); R(x+12+b,y+9,5,5,"#3A2433"); R(x+13+b,y+10,3,3,"#BFE8FF"); R(x+11+b,y+14,2,2,"#8A5A2B"); }
  if (o.prop === "tablet"){ R(x+3,y+13,10,6,"#3A2433"); R(x+4,y+14,8,4,"#1E3A2E"); const f = reduce ? 0 : Math.floor(t*6)%3; for (let i=0;i<3;i++) if (i<=f) R(x+5,y+14+i,2+i*2,1,"#7CFFB0"); }
  if (o.prop === "pointer"){ R(x-5,y+12,6,1,"#8A5A2B"); R(x-6,y+11,2,2,"#E05A4F"); }
  if (o.prop === "paper"){ R(x+3,y+12,10,8,"#3A2433"); R(x+4,y+13,8,6,"#FFFFFF"); R(x+5,y+14,5,1,"#B9C2DB"); R(x+5,y+16,4,1,"#B9C2DB"); R(x+9,y+16,2,2,"#E05A4F"); }
  if (o.prop === "mug"){ R(x+12,y+14,4,4,"#3A2433"); R(x+13,y+15,2,2,"#FFFFFF"); }
}

  t1:{ name:"", oy:39, wall:"#E6E3DE", wall2:"#DAD6CF", trim:"#8C8A86", tileA:"#C9C6C1", tileB:"#BFBCB6", line:"#B2AEA8",
    rug:"#5A6B7D", rug2:"#6E7F91", sofa:"#4A5568", sofa2:"#414B5C", sofa3:"#384150", chair:"#4A5568",

};

/* ===== 걷기 ===== */
function walkTo(p, x, z){
  if (Math.hypot(x-p.x, z-p.z) < .05){ p.to = null; return; }

}

function think(f, t){
  const w = world[f];
  for (const r of ROLES){
    const p = w.people[r];
    if (!eligible(f,r)) continue;
    if (p.task){
      if (!p.to && p.task.arrived === undefined) p.task.arrived = t;
      if (p.task.type === "toilet") p.hidden = !p.to && t < p.task.until;
      if (t < p.task.until) continue;
      p.hidden = false; p.task = null; p.nextAt = t + .4 + Math.random()*1.5;

  const w = world[f];

    if (eligible(f,r) && !p.nextAt) p.nextAt = performance.now()/1000 + Math.random()*3;

    // 일하는 사람: 초록 화살표
    if (kind === "work"){ const hop = reduce ? 0 : Math.round(Math.abs(Math.sin(t*5))*2); const ay = by - 24 + (o.sit?3:0) - 12 - 6 - hop;
      items.push({k:1000, d:() => { R(bx-3,ay,7,1,"#2E7D4F"); R(bx-2,ay+1,5,1,"#5BD69A"); R(bx-1,ay+2,3,1,"#5BD69A"); R(bx,ay+3,1,1,"#2E7D4F"); R(bx-3,ay+1,1,1,"#2E7D4F"); R(bx+3,ay+1,1,1,"#2E7D4F"); R(bx-2,ay+2,1,1,"#2E7D4F"); R(bx+2,ay+2,1,1,"#2E7D4F"); R(bx-1,ay+3,1,1,"#2E7D4F"); R(bx+1,ay+3,1,1,"#2E7D4F"); }}); }
    // 선생님 호출: 빨간 느낌표 깜빡임
    if (kind === "hot" && (reduce || Math.floor(t*3)%2)){ const ey = by - 24 + (o.sit?3:0) - 12 - 13;
      items.push({k:1000, d:() => { R(bx-3,ey,7,11,"#7A1E1E"); R(bx-2,ey+1,5,9,"#E8433A"); R(bx-.5,ey+2,2,4,"#FFFFFF"); R(bx-.5,ey+7,2,2,"#FFFFFF"); }}); }
    if (!walking){
      if ((st === "waiting" || st === "approval") && r === "leader"){ const k = reduce ? 0 : Math.floor(t*4)%4; items.push({k:999, d:() => { R(bx+7,by-19+k,2,3,"#6EC6F0"); R(bx+7,by-20+k,1,1,"#6EC6F0"); }}); }
      if (st === "done" && r === "leader"){ items.push({k:999, d:() => { const on = reduce || Math.floor(t*5)%2; const s = (x,y)=>{ R(x,y-1,1,3,"#FFD34D"); R(x-1,y,3,1,"#FFD34D"); }; if (on){ s(bx-12,by-20); s(bx+11,by-18); s(bx,by-30);} else { s(bx-9,by-24); s(bx+9,by-26); } }}); }
      if (arrived && task.type === "nap" && !reduce){ const k = (t*.7 + ROLES.indexOf(r)*.3)%1; items.push({k:999, d:() => { g.globalAlpha = Math.sin(k*Math.PI); R(bx+6+k*4,by-18-k*6,3,1,"#9A8FB0"); R(bx+8+k*4,by-17-k*6,1,1,"#9A8FB0"); R(bx+6+k*4,by-16-k*6,3,1,"#9A8FB0"); g.globalAlpha = 1; }}); }
    }
  }
  // 도우미
  w.helperList.forEach(h => {
    stepWalk(h, t);
    const walking = !!h.to;
    const o = {t, grey: st === "unknown", walk: walking ? (reduce ? 0 : (Math.floor(t*8)%2 ? 1 : 2)) : 0};
    if (!walking && st === "working") o.prop = {read:"book", search:"lens", run:"tablet", write:"tablet", plan:"book"}[act];
    items.push({k:h.x+h.z+.15, d:() => { const [sx,sy] = P(h.x,0,h.z); drawDoll(HELPER, sx, sy - (walking ? Math.floor(t*8)%2 : 0), o); }});
    const now = performance.now()/1000, [bx,by] = P(h.x,0,h.z);
    if (!h.leaving && now - h.born < 2.2) bubbles.push({x:bx, y:by-24, t:"출근합니다!"});
    if (h.leaving) bubbles.push({x:bx, y:by-24, t:"퇴근합니다!"});
  });

  items.sort((a,b)=>a.k-b.k).forEach(i => i.d());
  if (st === "unknown"){ g.fillStyle = "rgba(60,50,80,.28)"; g.fillRect(0, fl.oy-40, LW, 165); }
  let what = {working: ACT_SAY[act], waiting:"질문 대기", approval:"결재 대기", resting:"자유 시간", done:"작업 끝", unknown:"확인 중"}[st];
  if ((st === "waiting" || st === "approval") && VIEW !== "widget") what += " · 눌러서 답하기";
  labels.push({x:6, y:fl.oy-27, t:fl.name, sub:what, floor:true, lamp:LAMP[st], hot: st === "waiting" || st === "approval", t0:t});
}

/* ===== 매 프레임 ===== */
function frame(ms){
  const t = ms/1000;
  bubbles.length = 0; labels.length = 0;
  g.setTransform(1,0,0,1,0,0); g.imageSmoothingEnabled = false;
  const sky = g.createLinearGradient(0,0,0,LH); sky.addColorStop(0,"#DDE2E8"); sky.addColorStop(1,"#EEF0F3");
  g.fillStyle = sky; g.fillRect(0,0,LW,LH);
  // 구름 장식
  g.fillStyle = "#FFFFFF"; [[170,6],[205,26],[205,150],[210,280]].forEach(([x,y]) => { g.fillRect(x,y,14,4); g.fillRect(x+3,y-3,8,3); });
  for (const f of [...FLOOR_KEYS].reverse()) room(f, t);

  ctx.setTransform(1,0,0,1,0,0); ctx.imageSmoothingEnabled = false;
  ctx.drawImage(lo, 0, 0, LW*K, LH*K);
  ctx.setTransform(K,0,0,K,0,0);
  // 글자(선명하게)
  for (const l of labels){
    if (l.floor){
      ctx.font = `8px ${FONT}`; const tw = ctx.measureText(l.t).width;
      const sub = " · " + l.sub, sw = ctx.measureText(sub).width;
      const blink = l.hot && (reduce || Math.floor(l.t0*3)%2);
      ctx.fillStyle = blink ? "#FFE3CC" : "#FFFFFF"; roundRect(l.x-3, l.y-7, tw+sw+18, 13, 6); ctx.fill();
      ctx.strokeStyle = l.hot ? (blink ? "#E8433A" : "#FF8A3D") : "#9AA5B4"; ctx.lineWidth = l.hot ? 1.4 : 1; ctx.stroke();
      ctx.textBaseline = "middle"; ctx.textAlign = "left";
      ctx.fillStyle = l.lamp; ctx.beginPath(); ctx.arc(l.x+3, l.y, 3, 0, 7); ctx.fill();
      ctx.fillStyle = "#2B3340"; ctx.fillText(l.t, l.x+9, l.y);
      ctx.fillStyle = l.hot ? "#D9581F" : "#5F6B7A"; ctx.fillText(sub, l.x+9+tw, l.y);
    } else {
      ctx.save(); ctx.translate(l.x, l.y); if (l.slant) ctx.transform(1, -.5, 0, 1, 0, 0);
      ctx.font = `5px ${FONT}`; ctx.fillStyle = l.dark ? "#FFFFFF" : "#2B3340"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(l.t, 0, 0); ctx.restore();
    }
  }
  for (const b of bubbles){
    ctx.font = `7px ${TALK}`;
    const tw = ctx.measureText(b.t).width, w = tw + 10, h = 12;
    const bx = Math.max(2, Math.min(LW-2-w, b.x - w/2)), by = b.y - h;
    const bg = b.kind === "work" ? "#FFF3B8" : b.kind === "hot" ? "#FFE3CC" : "#FFFFFF";
    const line = b.kind === "work" ? "#D9A300" : b.kind === "hot" ? "#E8433A" : "#9AA5B4";
    ctx.fillStyle = bg; roundRect(bx, by, w, h, 6); ctx.fill();
    ctx.strokeStyle = line; ctx.lineWidth = b.kind === "plain" ? 1 : 1.4; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(b.x-2.5, by+h-.5); ctx.lineTo(b.x, by+h+3); ctx.lineTo(b.x+2.5, by+h-.5); ctx.fillStyle = bg; ctx.fill();
    ctx.fillStyle = b.kind === "hot" ? "#C2361E" : b.kind === "work" ? "#5A4300" : "#2B3340"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(b.t, bx + w/2, by + h/2 + .3);
  }
  requestAnimationFrame(frame);
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ===== 상태 바꾸기 ===== */
function setFloor(f, patch){
  Object.assign(world[f], patch);
  if (!STATES[world[f].state]) world[f].state = "unknown";
  refresh(f);
}
/* ===== 실제 상태 받기 ===== */
const NAME = {}; OFFICE.forEach(f => NAME[f.theme] = f.name);
const MIN = 60*1000;
function ago(ms){ const m = Math.round(ms/MIN); return m < 1 ? "방금" : m < 60 ? m+"분 전" : Math.round(m/60)+"시간 전"; }
function applyStatus(data){
  document.getElementById("mode").textContent = "실시간";
  const list = document.getElementById("list"); list.innerHTML = "";
  for (const f of FLOOR_KEYS){
    const d = data && data[f];
    let state = "resting", act = world[f].act, helpers = 0, info = "기록 없음 · 자유 시간";
    if (d){
      const age = Date.now() - new Date(d.updatedAt).getTime();
      state = STATES[d.state] ? d.state : "working";
      if (ACTS[d.activity]) act = d.activity;
      helpers = Math.max(0, Math.min(2, d.helpers|0));
      if (state === "working" && age > 30*MIN) state = "unknown";      // 오래 조용하면 멈춘 것일 수 있음
      if (state === "done" && age > 10*MIN) state = "resting";         // 끝나고 시간이 지나면 자유 시간
      const pc = /_메인/.test(d.source||"") ? " (메인)" : /_서브/.test(d.source||"") ? " (서브)" : "";
      info = STATES[state] + pc + (d.note ? " · " + d.note : "") + " · " + ago(age);
    }
    setFloor(f, {state, act, helpers: state === "working" ? helpers : 0});
    world[f].link = (d && d.link) || "";
    const li = document.createElement("li");
    li.innerHTML = `<b></b><br><small></small>`;
    li.querySelector("b").textContent = NAME[f];
    li.querySelector("small").textContent = info;
    list.appendChild(li);
  }
  document.getElementById("msg").textContent = "마지막 확인: " + new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
// 층을 누르면 그 층의 Cowork 작업 열기
cv.addEventListener("click", ev => {
  const r = cv.getBoundingClientRect(), y = (ev.clientY - r.top) / r.height * LH;
  let f = FLOOR_KEYS[0];
  FLOOR_KEYS.forEach((k, i) => { if (y >= 39 + 126 * i - 40) f = k; });
  if (window.Android) Android.openFloor(f);
});
cv.style.cursor = "pointer";

function poll(){ if (window.Android) Android.ready(); }

function tick(){ document.getElementById("clock").textContent = new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}); }
tick(); setInterval(tick, 30000);

for (const f of FLOOR_KEYS) setFloor(f, {state:"unknown", helpers:0});
poll(); setInterval(poll, 20000);
requestAnimationFrame(frame);
</script>
